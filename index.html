<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fußball Turnsaal-App</title>
<meta name="description" content="Übungssammlung Fußball (BORG Deutsch-Wagram) mit Gruppeneinteilung, Filtern, Stundenvorschlag und Videos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231B4332'/%3E%3Ccircle cx='32' cy='32' r='14' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f4;--card:#ffffff;--ink:#16211b;--mute:#5b6b62;--line:#d9e2dc;--acc:#1B4332;--acc2:#2d6a4f;--soft:#e3efe6;--E:#2874A6;--F:#1E8449;--P:#B03A2E;--hi:#fff6d6;--chip:#eef3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#17201b;--ink:#e6eee9;--mute:#9aaba1;--line:#2a3830;--acc:#7cc59a;--acc2:#a3d9b8;--soft:#1e2c24;--hi:#3a3420;--chip:#22302a}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#17201b;--ink:#e6eee9;--mute:#9aaba1;--line:#2a3830;--acc:#7cc59a;--acc2:#a3d9b8;--soft:#1e2c24;--hi:#3a3420;--chip:#22302a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:10px 16px}
:root[data-theme="dark"] header{background:#123024}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#123024}}
.top{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.top h1{font-size:17px;margin:0;flex:1}
.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
nav{display:flex;gap:6px;max-width:980px;margin:8px auto 0}
nav button{flex:1;background:rgba(255,255,255,.12);border:0;color:#fff;padding:8px 6px;border-radius:8px;font-weight:600;font-size:14px}
nav button.on{background:#fff;color:#1B4332}
main{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.lbl{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;width:100%}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:20px}
.step input{width:64px;height:40px;text-align:center;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .chip.on{color:#0f1512}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0f1512}}
.chip.E.on{background:var(--E);border-color:var(--E);color:#fff}.chip.F.on{background:var(--F);border-color:var(--F);color:#fff}.chip.P.on{background:var(--P);border-color:var(--P);color:#fff}
select,input[type=search]{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px;font-size:14px;min-width:0}
input[type=search]{flex:1 1 180px}
.count{font-size:13px;color:var(--mute);margin:4px 2px 10px}
.card{scroll-margin-top:118px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ch{background:var(--acc);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
:root[data-theme="dark"] .ch{background:#1d4a35}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ch{background:#1d4a35}}
.ch .id{font-weight:800;opacity:.85;min-width:30px}
.ch .tt{flex:1;font-weight:700}
.ch .st{display:flex;gap:3px}
.b{display:inline-block;min-width:20px;text-align:center;border-radius:5px;font-size:12px;font-weight:800;padding:1px 5px;color:#fff}
.b.E{background:var(--E)}.b.F{background:var(--F)}.b.P{background:var(--P)}
.star{background:none;border:0;color:#fff;font-size:20px;line-height:1;padding:0 2px;cursor:pointer;opacity:.75}
.star.on{opacity:1;color:#ffd166}
.cb{padding:10px 12px}
.meta{font-size:13px;color:var(--mute);margin-bottom:6px}
.grp{background:var(--soft);border-radius:8px;padding:7px 10px;font-size:14px;margin:6px 0 10px;font-weight:600}
.grp.warn{background:#fde2e1;color:#7a1f17}
.cb img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block;margin:4px 0 10px;background:#2E5E30}
.cb h4{margin:10px 0 4px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.cb ol{margin:4px 0 6px;padding-left:22px}.cb li{margin:3px 0}
.dif div{padding:5px 8px;border-radius:7px;margin:3px 0;font-size:14px}
.dif div.sel{background:var(--hi);font-weight:600}
.tip{font-style:italic;border-left:3px solid var(--acc2);padding:4px 10px;margin:8px 0}
.vids{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vids a{display:block;border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-decoration:none;color:var(--ink);background:var(--chip)}
.vids a small{display:block;color:var(--mute)}
.vids a b{color:var(--acc);font-size:12px;text-transform:uppercase}
.src{font-size:12px;color:var(--mute);margin-top:8px}
.src a{color:var(--mute)}
.share{font-size:12px;color:var(--mute);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;margin-top:6px}
.phase{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--card)}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--soft);font-weight:700}
.ph span{flex:1}
.ph button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.foot{font-size:12px;color:var(--mute);text-align:center;margin-top:20px}
.hide{display:none}
</style>
</head>

<header>
 <div class="top"><h1>⚽ Fußball · Turnsaal-App</h1><button id="theme" aria-label="Hell/Dunkel">◐</button></div>
 <nav><button data-tab="list" class="on">Übungen</button><button data-tab="plan">Stunde</button><button data-tab="fav">Merkliste <span id="favn"></span></button></nav>
</header>
<main>
 <section class="panel" id="ctrl">
  <div class="row"><span class="lbl">Teilnehmer heute</span>
   <div class="step"><button id="minus" aria-label="weniger">−</button><input id="n" type="number" min="2" max="60" value="16" inputmode="numeric"><button id="plus" aria-label="mehr">+</button></div>
  </div>
  <div class="row"><span class="lbl">Stufe (Differenzierung hervorheben / filtern)</span><span id="stufen"></span></div>
  <div class="row filt"><span class="lbl">Filter</span>
   <select id="einheit"><option value="">alle Einheiten</option></select>
   <input type="search" id="q" placeholder="Suche (z. B. Rondo, Kopfball)">
   <label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="vid"> nur mit Video</label>
  </div>
  <div class="row filt" id="themen"></div>
 </section>
 <div id="list"></div>
 <div id="plan" class="hide"></div>
 <div id="fav" class="hide"></div>
 <p class="foot">Übungssammlung zur Jahresplanung „Fußball – Unverbindliche Übung“ (BORG Deutsch-Wagram). Videos stammen von YouTube-Kanälen Dritter.</p>

(function(){

// Gruppeneinteilung
function teilung(u,n){
 if(n<u.mn) return {w:true,t:'Zu wenige: mindestens '+u.mn+' Personen nötig.'};
 var g=u.g;
 if(g===0){ // Teams/ganze Gruppe
   var m=/(\d)\s*Teams/.exec(u.gr); var k=m?parseInt(m[1],10):2;
   if(/3 Teams/.test(u.gr)) k=3; if(/4 Teams/.test(u.gr)) k=4;
   if(/6–8 Teams/.test(u.gr)) k=Math.max(2,Math.round(n/5));
   if(!m && !/Teams/.test(u.gr)) return {t:'Ganze Gruppe ('+n+') – '+u.gr};
   var base=Math.floor(n/k), r=n%k;
   return {t:k+' Teams à '+base+(r?' ('+r+' davon zu '+(base+1)+')':'')};
 }
 if(g===1) return {t:'Alle einzeln ('+n+')'};
 if(g===2){var p=Math.floor(n/2); if(n%2) return {t:(p-1)+' Paare + 1 Dreiergruppe'}; return {t:p+' Paare'};}
 var k=Math.floor(n/g); if(k<1) return {w:true,t:'Zu wenige für Gruppen à '+g};
 var r=n-k*g; var txt=k+' Gruppen à '+g;
 if(r){ if(r<=k) txt=k+' Gruppen à '+g+' ('+r+' davon zu '+(g+1)+')'; else {k=k+1; var b=Math.floor(n/k), rr=n%k; txt=k+' Gruppen à '+b+(rr?' ('+rr+' davon zu '+(b+1)+')':'');} }
 return {t:txt};
}
function card(u){

 if(u.v.length){h+='<h4>Videos</h4><div class="vids">'+u.v.map(function(v){return '<a href="https://youtu.be/'+v.id+'" target="_blank" rel="noopener"><b>'+esc(v.ty)+'</b>'+esc(v.ti)+'<small>'+esc(v.ch)+'</small></a>'}).join('')+'</div>';}

 h+='<button class="share" data-share="'+u.id+'">Link zu dieser Übung kopieren</button>';
 return h+'</div></article>';
}
function match(u){
 if(st.stufe && u.s.indexOf(st.stufe)<0) return false;
 if(st.th && u.t!==st.th) return false;

 return true;
}

function pool(i){

}
function renderPlan(){

 var used={};
 PH.forEach(function(p,i){
  var P=pool(i).filter(function(u){return !used[u.id]}); if(!P.length) P=pool(i);

// Controls
var sh='';['E','F','P'].forEach(function(x){sh+='<button class="chip '+x+'" data-st="'+x+'">'+({E:'E Einsteiger',F:'F Fortgeschritten',P:'P Profi'})[x]+'</button> '}); $('#stufen').innerHTML=sh;
var th2='<button class="chip on" data-th="">alle Themen</button>'; TH.forEach(function(t){th2+='<button class="chip" data-th="'+t[0]+'">'+t[0]+' · '+esc(t[1])+'</button>'}); $('#themen').innerHTML=th2;
var sel=$('#einheit'); for(var i=1;i<=30;i++){var o=document.createElement('option');o.value=i;o.textContent='Einheit '+i+': '+(ET[i]||'');sel.appendChild(o)}
$('#n').value=st.n;
function setN(v){v=Math.max(2,Math.min(60,v|0)); st.n=v; $('#n').value=v; ls('fb_n',v); render();}
$('#minus').onclick=function(){setN(st.n-1)}; $('#plus').onclick=function(){setN(st.n+1)}; $('#n').onchange=function(){setN(+this.value)};
$('#einheit').onchange=function(){st.e=this.value; pick=[0,0,0,0,0]; render()};
$('#q').oninput=function(){st.q=this.value.trim(); render()};
$('#vid').onchange=function(){st.vid=this.checked; render()};
document.addEventListener('click',function(ev){
 var t=ev.target.closest('button'); if(!t) return;
 if(t.dataset.tab){st.tab=t.dataset.tab; document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b===t)}); render(); window.scrollTo(0,0);}
 else if(t.dataset.st!==undefined){st.stufe=st.stufe===t.dataset.st?'':t.dataset.st; document.querySelectorAll('[data-st]').forEach(function(b){b.classList.toggle('on',b.dataset.st===st.stufe)}); render();}
 else if(t.dataset.th!==undefined){st.th=t.dataset.th; document.querySelectorAll('[data-th]').forEach(function(b){b.classList.toggle('on',b.dataset.th===st.th)}); render();}
 else if(t.dataset.fav){var id=t.dataset.fav,k=favs.indexOf(id); if(k>=0)favs.splice(k,1); else favs.push(id); ls('fb_favs',JSON.stringify(favs)); render();}
 else if(t.dataset.swap!==undefined){pick[+t.dataset.swap]++; renderPlan();}
 else if(t.dataset.share){var url=location.href.split('#')[0]+'#'+t.dataset.share; try{navigator.clipboard.writeText(url); t.textContent='Link kopiert ✓';}catch(e){t.textContent=url;}}
 else if(t.id==='theme'){var cur=document.documentElement.getAttribute('data-theme'); var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches; var nv=dark?'light':'dark'; document.documentElement.setAttribute('data-theme',nv); ls('fb_theme',nv);}
});
render();
// Deep-Link #ID
function deep(){var h=decodeURIComponent(location.hash.slice(1)); if(!h) return; var u=U.filter(function(x){return x.id===h})[0]; if(!u) return;
 st.tab='list'; st.th=''; st.e=''; st.q=''; st.vid=false; st.stufe=''; $('#q').value=''; $('#einheit').value=''; $('#vid').checked=false;
 document.querySelectorAll('[data-th]').forEach(function(b){b.classList.toggle('on',b.dataset.th==='')});
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab==='list')});
 render(); var el=document.getElementById(h); if(el) el.scrollIntoView();}
window.addEventListener('hashchange',deep); deep();
})();
